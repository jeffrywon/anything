<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>AI Web Operator</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        width: 320px;
        font-family: Arial, sans-serif;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      textarea {
        width: 100%;
        min-height: 90px;
        resize: vertical;
      }
      .row {
        margin-top: 10px;
        display: flex;
        gap: 8px;
      }
      button {
        flex: 1;
        padding: 8px;
        cursor: pointer;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        color: #444;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>AI Web Operator</h1>
    <textarea id="goal" placeholder="输入你的目标，例如：登录后打开订单页并搜索最近一个订单"></textarea>
    <div class="row">
      <button id="start">Start</button>
      <button id="stop">Stop</button>
    </div>
    <div id="status">就绪</div>
    <script src="popup.js"></script>
  </body>
</html>
